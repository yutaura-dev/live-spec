name: publish

# main の package.json の version が npm にまだない版なら、検査を通してから公開する。
# タグを打って公開する形にしない理由: 版を上げる commit を push するだけで公開まで進むほうが、
# 今の流れ（版を上げて push し、公開を確かめてから利用側へ知らせる）を変えずに済むため。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node src/cli.ts check specs

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm の trusted publishing（OIDC）で公開する。長く使える npm token を GitHub に置かずに済み、provenance も付く。
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@yutaura/live-spec@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        run: pnpm install --frozen-lockfile
      # pnpm publish ではなく npm publish を使う理由: trusted publishing の OIDC の受け渡しに対応しているのが npm CLI（11.5.1 以降）のため。
      # ビルドは prepack（pnpm build）で走る。
      - if: steps.version.outputs.published == 'false'
        run: npm publish
      - if: steps.version.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
